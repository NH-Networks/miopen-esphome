# ============================================================
# iohomecontrol - LilyGO T3-S3 V1.2
# ESPHome config — native API, no MQTT
# Requires ESPHome >= 2026.7.0
# ============================================================

esphome:
  name: iohomecontrol
  friendly_name: io-homecontrol Gateway
  build_flags:
    - "-DRADIO_SX127X"
    - "-DLILYGO_T3S3" # REQUIRED: selects correct GPIO map for your board
    - "-DARDUINO_USB_MODE=1"
    - "-DARDUINO_USB_CDC_ON_BOOT=1"
  on_boot:
    priority: 600
    then:
      - logger.log: "io-homecontrol gateway booting"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "iohomecontrol"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:

ota:
  platform: esphome

web_server:
  port: 80
  version: 3

external_components:
  - source:
      type: git
      url: https://github.com/NH-Networks/miopen-esphome
      ref: 736dac22017cfac40101f7f47d1bbe47708605ae
      components: [iohomecontrol]

iohomecontrol:
  id: iohc_gw
  sck_pin: 5
  miso_pin: 3
  mosi_pin: 6
  nss_pin: 7
  reset_pin: 8
  dio0_pin: 9 # matches LILYGO_T3S3 board-config.h mapping
  dio1_pin: 33
  frequency: 868950000
  devices_file: "/1W.json"

  rssi_sensor:
    name: "Gateway RSSI"
    unit_of_measurement: "dBm"
    icon: mdi:signal

  rx_counter:
    name: "Frames ontvangen"
    icon: mdi:radio-tower

  tx_counter:
    name: "Frames verzonden"
    icon: mdi:send

  status_sensor:
    name: "Gateway status"
    icon: mdi:information-outline

  last_addr_sensor:
    id: iohc_gw_last_addr
    name: "Laatste adres"
    icon: mdi:magnify

  pending_sensor:
    name: "Scherm in pair mode"
    icon: mdi:link-variant

  scan_button:
    name: "Scan (luister naar schermen)"
    icon: mdi:magnify-scan

  new_remote_button:
    name: "Nieuw virtueel remote aanmaken"
    icon: mdi:remote

  add_button:
    name: "Koppel scherm"
    icon: mdi:link-variant-plus

  remove_button:
    name: "Ontkoppel scherm"
    icon: mdi:link-variant-remove

  reload_button:
    name: "Herlaad 1W.json"
    icon: mdi:reload

text:
  - platform: template
    id: device_name_input
    name: "Scherm naam"
    icon: mdi:tag-text
    mode: text
    optimistic: true
    initial_value: ""
    on_value:
      then:
        - lambda: 'id(iohc_gw).set_device_name(x.c_str());'

  - platform: template
    id: target_device_input
    name: "Doel scherm ID"
    icon: mdi:identifier
    mode: text
    optimistic: true
    initial_value: ""
    on_value:
      then:
        - lambda: 'id(iohc_gw).set_target_device(x.c_str());'

button:
  - platform: template
    name: "Gebruik laatste adres als doel"
    icon: mdi:arrow-down-bold
    on_press:
      then:
        - text.set:
            id: target_device_input
            value: !lambda 'return id(iohc_gw_last_addr).state;'

time:
  - platform: homeassistant
    id: ha_time
