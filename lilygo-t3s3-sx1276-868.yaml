# ==============================================================
# ESPHome template — LilyGO T3-S3 V1.2 + SX1276 868 MHz
# io-homecontrol gateway (Somfy / Velux 1W)
# Minimum ESPHome version: 2026.7.0
# ==============================================================

esphome:
  name: iohomecontrol
  friendly_name: "io-homecontrol Gateway"
  comment: "LilyGO T3-S3 V1.2 · SX1276 868 MHz · ESPHome 2026.7+"
  min_version: "2026.7.0"       # fail clearly on older ESPHome
  platformio_options:
    build_flags:
      - "-DESP32"
      - "-DARDUINO_USB_MODE=1"
      - "-DARDUINO_USB_CDC_ON_BOOT=1"
  on_boot:
    priority: 600
    then:
      - logger.log: "io-homecontrol gateway gestart"

# ── Board ───────────────────────────────────────────────────────
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf             # recommended in 2026.7.0 (was arduino)
    version: recommended
  toolchain: esp-idf          # explicit: 2026.7.0 default, but be clear

# ── WiFi ────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # fast_connect: true         # uncomment if SSID is hidden
  ap:
    ssid: "iohc-fallback"
    password: !secret ap_password

captive_portal:

# ── Logging ─────────────────────────────────────────────────────
logger:
  level: INFO
  baud_rate: 115200
  # level: DEBUG   # enable during troubleshooting

# ── Home Assistant native API ────────────────────────────────────
api:
  encryption:
    key: !secret api_encryption_key
  services:
    # Call from HA automation: esphome.iohomecontrol_pair_screen
    - service: pair_screen
      variables:
        screen_name: string
        screen_id: string
      then:
        - lambda: |-
            id(iohc_gw).set_device_name(screen_name.c_str());
            id(iohc_gw).set_target_device(screen_id.c_str());
        - button.press: add_btn

# ── OTA ──────────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

# ── Web server (http://iohomecontrol.local) ──────────────────────
# 2026.7.0 notes:
#   - version 1 is deprecated (removal 2027.1.0) → use version 3
#   - cross-origin requests now blocked by default
#   - enable_private_network_access now off by default
web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password
    type: digest               # digest keeps password off the network (new in 2026.7)
  enable_private_network_access: true   # allow LAN browser access
  # allowed_origins:           # uncomment if accessing from another LAN host
  #   - "http://homeassistant.local:8123"

# ── External component ───────────────────────────────────────
external_components:
  - source: github://NH-Networks/miopen-esphome
    components: [iohomecontrol]

# ── iohomecontrol gateway ────────────────────────────────────
iohomecontrol:
  id: iohc_gw
  # LilyGO T3-S3 V1.2 SX1276 pinout
  sck_pin:   5
  miso_pin:  3
  mosi_pin:  6
  nss_pin:   7
  reset_pin: 8
  dio0_pin:  33
  dio1_pin:  34
  frequency: 868950000
  devices_file: "/1W.json"

  rssi_sensor:
    name: "Gateway RSSI"
    icon: mdi:signal
    unit_of_measurement: "dBm"
    entity_category: diagnostic

  rx_counter:
    name: "Ontvangen frames"
    icon: mdi:radio-tower
    entity_category: diagnostic

  tx_counter:
    name: "Verzonden frames"
    icon: mdi:send
    entity_category: diagnostic

  status_sensor:
    name: "Gateway status"
    icon: mdi:information-outline
    entity_category: diagnostic

  last_addr_sensor:
    id: last_addr_sensor
    name: "Laatste gehoord adres"
    icon: mdi:magnify

  pending_sensor:
    name: "Scherm in pair mode"
    icon: mdi:link-variant

  scan_button:
    id: scan_btn
    name: "Scan — luister naar schermen"
    icon: mdi:magnify-scan

  new_remote_button:
    id: new_remote_btn
    name: "Maak nieuw virtueel remote"
    icon: mdi:remote-tv

  add_button:
    id: add_btn
    name: "Koppel scherm"
    icon: mdi:link-variant-plus

  remove_button:
    name: "Ontkoppel scherm"
    icon: mdi:link-variant-remove

  reload_button:
    name: "Herlaad apparatenlijst"
    icon: mdi:reload

# ── Tekstinvoer voor koppeling ───────────────────────────────────
text:
  - platform: template
    id: device_name_input
    name: "Scherm naam"
    icon: mdi:tag-text
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    on_value:
      then:
        - lambda: 'id(iohc_gw).set_device_name(x.c_str());'

  - platform: template
    id: target_device_input
    name: "Doel scherm ID"
    icon: mdi:identifier
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 8
    on_value:
      then:
        - lambda: 'id(iohc_gw).set_target_device(x.c_str());'

# ── Hulpknoppen ─────────────────────────────────────────────────
button:
  - platform: template
    name: "Gebruik laatste adres als doel"
    icon: mdi:arrow-down-bold
    # Kopieert 'Laatste gehoord adres' direct naar 'Doel scherm ID'
    on_press:
      then:
        - text.set:
            id: target_device_input
            value: !lambda 'return id(last_addr_sensor).state;'

# ── Tijdsynchronisatie ───────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

