name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: ESPHome component compile check (2026.7.2)
  # ---------------------------------------------------------------------------
  esphome-build:
    name: ESPHome compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome==2026.7.2

      - name: Create dummy secrets.yaml for CI
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-network"
          wifi_password: "ci-password"
          ap_password: "ci-ap-password"
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "ci-ota-password"
          web_password: "ci-web-password"
          EOF

      - name: Compile ESPHome firmware (LilyGO T3-S3 SX1276 868)
        run: esphome compile lilygo-t3s3-sx1276-868.yaml

  # ---------------------------------------------------------------------------
  # Job 2: PlatformIO firmware build + release (tags only)
  # ---------------------------------------------------------------------------
  build-and-release:
    name: PlatformIO build & release
    runs-on: ubuntu-latest
    needs: esphome-build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: n-vr/setup-platformio-action@v1

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install esptool
        run: pip install -U esptool

      - name: Generate release tag
        id: generate_release_tag
        uses: alexvingg/next-release-tag@v1.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''

      - name: Build PlatformIO project
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run

      - name: Build filesystem
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -t buildfs

      - name: Merge bin files for LilyGoLoraESP32
        run: esptool --chip esp32 merge-bin -o LilyGoLoraESP32.bin --flash-size 4MB 0x1000 .pio/build/LilyGoLoraESP32/bootloader.bin 0x8000 .pio/build/LilyGoLoraESP32/partitions.bin 0x10000 .pio/build/LilyGoLoraESP32/firmware.bin 0x210000 .pio/build/LilyGoLoraESP32/littlefs.bin

      - name: Merge bin files for HeltecLoraV2ESP32
        run: esptool --chip esp32 merge-bin -o HeltecLoraV2ESP32.bin --flash-size 8MB 0x1000 .pio/build/HeltecLoraV2ESP32/bootloader.bin 0x8000 .pio/build/HeltecLoraV2ESP32/partitions.bin 0x10000 .pio/build/HeltecLoraV2ESP32/firmware.bin 0x670000 .pio/build/HeltecLoraV2ESP32/littlefs.bin

      - name: Prepare firmware files for release
        run: |
          mv .pio/build/LilyGoLoraESP32/firmware.bin LilyGoLoraESP32_firmware.bin
          mv .pio/build/LilyGoLoraESP32/littlefs.bin LilyGoLoraESP32_filesystem.bin
          mv .pio/build/HeltecLoraV2ESP32/firmware.bin HeltecLoraV2ESP32_firmware.bin
          mv .pio/build/HeltecLoraV2ESP32/littlefs.bin HeltecLoraV2ESP32_filesystem.bin

      - name: Generate release changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: changelog.md
          onlyLastTag: true
          stripHeaders: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          body_path: changelog.md
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          files: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            changelog.md
